<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>屋久島町 ご相談資料 画像版</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f1;
      --ink: #1a1a1a;
      --sub: #626262;
      --card: #ffffff;
      --rule: #ddddda;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --ink: #f4f4f4;
        --sub: #b8b8b8;
        --card: #1b1b1b;
        --rule: #333;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 10px 40px;
    }
    header {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 14px rgba(0,0,0,.05);
    }
    h1 {
      font-size: 20px;
      line-height: 1.35;
      margin: 0 0 6px;
    }
    p {
      margin: 0;
      color: var(--sub);
      font-size: 14px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    a.button {
      display: block;
      text-align: center;
      padding: 12px 12px;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    a.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .slide {
      margin: 0 0 14px;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,.06);
    }
    .slide img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    .caption {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--sub);
    }
    .note {
      font-size: 12px;
      color: var(--sub);
      padding: 4px 2px 0;
    }
    @media (max-width: 520px) {
      main {
        padding: 10px 6px 28px;
      }
      header {
        border-radius: 10px;
        padding: 14px;
      }
      .actions {
        grid-template-columns: 1fr;
      }
      .slide {
        margin-bottom: 10px;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>屋久島町 ご相談資料 画像版</h1>
      <p>PDFを開かなくても、下に7枚のスライドをそのまま表示します。iPhoneではこちらの方が軽く見られます。</p>
      <div class="actions">
        <a class="button" href="#slide-1">画像で見る</a>
        <a class="button secondary" href="#slide-7">最後のページへ</a>
      </div>
    </header>

    <figure class="slide" id="slide-1">
      <img src="./slide-01.png" width="1920" height="1080" alt="スライド1 表紙" loading="eager" decoding="async">
      <figcaption class="caption">1 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-2">
      <img src="./slide-02.png" width="1920" height="1080" alt="スライド2 本日ご相談したいこと" loading="lazy" decoding="async">
      <figcaption class="caption">2 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-3">
      <img src="./slide-03.png" width="1920" height="1080" alt="スライド3 閉館後の一画を小さく使う選択肢" loading="lazy" decoding="async">
      <figcaption class="caption">3 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-4">
      <img src="./slide-04.png" width="1920" height="1080" alt="スライド4 仮設で小さく始める" loading="lazy" decoding="async">
      <figcaption class="caption">4 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-5">
      <img src="./slide-05.png" width="1920" height="1080" alt="スライド5 町の負担と公園利用への影響" loading="lazy" decoding="async">
      <figcaption class="caption">5 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-6">
      <img src="./slide-06.png" width="1920" height="1080" alt="スライド6 照明と水の扱い" loading="lazy" decoding="async">
      <figcaption class="caption">6 / 7</figcaption>
    </figure>
    <figure class="slide" id="slide-7">
      <img src="./slide-07.png" width="1920" height="1080" alt="スライド7 次の進め方" loading="lazy" decoding="async">
      <figcaption class="caption">7 / 7</figcaption>
    </figure>

    <div class="note">一時確認用URLです。URLを知っている人は閲覧できます。</div>
  </main>
</body>
</html>
