<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>屋久島町 ご相談資料 PDF</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f2;
      --ink: #1a1a1a;
      --sub: #626262;
      --card: #ffffff;
      --rule: #ddddda;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --ink: #f4f4f4;
        --sub: #b8b8b8;
        --card: #1b1b1b;
        --rule: #333;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,.06);
    }
    h1 {
      font-size: 22px;
      line-height: 1.35;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 14px;
      color: var(--sub);
      font-size: 15px;
    }
    .actions {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }
    a.button {
      display: block;
      text-align: center;
      padding: 13px 16px;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    iframe {
      width: 100%;
      height: 78vh;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: #fff;
      margin-top: 14px;
    }
    .note {
      font-size: 12px;
      color: var(--sub);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>屋久島町 ご相談資料 PDF</h1>
      <p>iPhoneで埋め込み表示が動かない場合は、下の「PDFを開く」を押してください。</p>
      <div class="actions">
        <a class="button" href="./deck.pdf">PDFを開く</a>
        <a class="button secondary" href="./deck.pdf" download>PDFをダウンロード</a>
      </div>
      <iframe src="./deck.pdf" title="PDF preview"></iframe>
      <div class="note">一時確認用URLです。URLを知っている人は閲覧できます。</div>
    </div>
  </main>
</body>
</html>
