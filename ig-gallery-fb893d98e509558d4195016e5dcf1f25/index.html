<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IG Saved Gallery — preview</title>
<style>
  :root {
    --bg: #0e0e10;
    --bg-tile: #1a1a1d;
    --fg: #f0f0f3;
    --fg-muted: #8a8a93;
    --accent: #ff5e7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(14,14,16,0.95); backdrop-filter: blur(8px); z-index: 10; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .meta { font-size: 11px; color: var(--fg-muted); margin-top: 4px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 3px; padding: 3px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  .tile {
    aspect-ratio: 1;
    background: var(--bg-tile);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease;
  }
  .tile:active { transform: scale(0.97); }
  .tile img, .tile video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.open { display: block; }
  .modal-inner {
    max-width: 600px; margin: 0 auto;
    padding: 60px 16px 80px;
  }
  .modal-inner img, .modal-inner video {
    max-width: 100%; height: auto; display: block; margin: 0 auto;
    border-radius: 4px;
  }
  .modal-meta {
    margin: 16px 0 8px;
    font-size: 12px; color: var(--fg-muted);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .modal-meta a { color: var(--accent); text-decoration: none; }
  .caption {
    margin-top: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
  }
  .close-btn {
    position: fixed; top: 12px; right: 16px;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 101;
    font-size: 20px; user-select: none;
  }
  .empty {
    padding: 60px 20px; text-align: center;
    color: var(--fg-muted);
  }
</style>
</head>
<body>
<header>
  <h1>IG Saved Gallery</h1>
  <div class="meta">preview / 0 件 / 生成: 2026-05-20 11:38</div>
</header>
<div class="grid">

</div>
<div class="modal" id="modal">
  <div class="close-btn" id="close-btn">×</div>
  <div class="modal-inner" id="modal-inner"></div>
</div>
<div class="empty">まだ saved がないみたい。<br>watcher が cycle 完了するまで待ってね。</div>
<script>
const items = [];
const itemMap = Object.fromEntries(items.map(x => [x.shortcode, x]));
function b64decode(s) {
  return decodeURIComponent(Array.prototype.map.call(atob(s), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
function openModal(shortcode) {
  const item = itemMap[shortcode];
  if (!item) return;
  const inner = document.getElementById('modal-inner');
  const mediaTag = item.is_video
    ? `<video src="${item.media}" controls playsinline autoplay></video>`
    : `<img src="${item.media}" alt="${shortcode}">`;
  const body = b64decode(item.body_b64);
  inner.innerHTML = `
    ${mediaTag}
    <div class="modal-meta">
      <span>📁 ${item.coll}</span>
      <span>src: ${item.src}</span>
      <a href="${item.url}" target="_blank" rel="noopener">元投稿 ↗</a>
    </div>
    <div class="caption">${body.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('modal-inner').innerHTML = '';
}
document.querySelectorAll('.tile').forEach(t => {
  t.addEventListener('click', () => openModal(t.dataset.shortcode));
});
document.getElementById('close-btn').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
