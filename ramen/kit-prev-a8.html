<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>有料キット draft preview（社内確認用）</title>
<style>
  body{max-width:760px; margin:0 auto; padding:20px 16px 70px; font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.85; color:#1c1a17; background:#f4efe6; -webkit-text-size-adjust:100%;}
  .banner{background:#b5462e; color:#fff; font-size:11.5px; padding:7px 12px; border-radius:4px; margin-bottom:18px; line-height:1.6;}
  h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif; font-size:23px; line-height:1.4;}
  h2{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif; font-size:18px; border-bottom:1px solid #ddd4c4; padding-bottom:5px; margin-top:38px;}
  h3{font-size:15px; color:#b5462e; margin-top:26px;}
  table{border-collapse:collapse; width:100%; font-size:12.5px; margin:14px 0;}
  th,td{border:1px solid #ddd4c4; padding:6px 9px; text-align:left; vertical-align:top;}
  th{background:#efe7d8;}
  blockquote{border-left:3px solid #b5462e; margin:14px 0; padding:8px 15px; background:#fffdf8; color:#3a352e; border-radius:0 4px 4px 0;}
  code{background:#e8e0d0; padding:1px 5px; border-radius:3px; font-size:12.5px;}
  pre{background:#2b2722; color:#f0e8d8; padding:13px 15px; border-radius:5px; overflow-x:auto; font-size:12px; line-height:1.6;}
  pre code{background:none; padding:0; color:inherit;}
  hr{border:none; border-top:1px solid #ddd4c4; margin:26px 0;}
  strong{color:#1c1a17;}
  a{color:#b5462e;}
</style>
</head>
<body>
<div class="banner">⚠ 社内確認用 draft preview（noindex・未公開・未販売）。価格/note公開はジョニー判断（G5）。本文の数値・トーンの確認用。</div>
<div id="c">読み込み中…</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('kit-prev-a8.md', {cache:'no-store'})
    .then(r => r.text())
    .then(t => { marked.setOptions({gfm:true, breaks:false}); document.getElementById('c').innerHTML = marked.parse(t); })
    .catch(e => { document.getElementById('c').textContent = 'load error: ' + e; });
</script>
</body>
</html>
