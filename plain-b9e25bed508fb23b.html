:root{--bg:#F6F3EE;--sf:#FFFFFF;--sf2:#EFEAE2;--line:#E2DCD2;--t1:#1F2328;--t2:#4A4F57;--t3:#80858D;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font:400 15px/1.6 var(--f);letter-spacing:.01em;overflow-wrap:anywhere;line-break:strict}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bar h1{font-size:20px;font-weight:700}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sf2);color:var(--t2)}
.tag.proto{background:#FFF1D6;color:#8A5A00}
.fresh{margin-left:auto;font-size:12px;color:var(--t3)}
.tabs{max-width:1180px;margin:0 auto;padding:8px 8px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 12px;font-size:14px;font-weight:600;color:var(--t3);border-bottom:3px solid transparent;white-space:nowrap}

.tabs .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--err);color:#fff;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 120px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:16px;background:var(--sf);border:1px solid var(--line);font-size:13px;color:var(--t2);min-height:32px}

.layout{display:grid;grid-template-columns:1fr;gap:16px}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:start;width:100%}
.row:hover{border-color:#cfc6b8}.row[aria-current=true]{border-color:var(--ac);box-shadow:0 0 0 2px rgba(19,135,127,.15)}

.panel{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;align-self:start}

 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}}
.panel h2{font-size:18px;line-height:1.4;margin-bottom:4px}

.h3{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.06em;margin:16px 0 6px}

.act.proto{background:var(--sf);border:1.5px dashed #BDB5A8;color:var(--t2)}
.act small{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap}
.act.real small{background:rgba(255,255,255,.22)}.act.proto small{background:var(--sf2)}
.act[disabled]{opacity:.45;cursor:not-allowed}
.files{font-size:12.5px;color:var(--t2);display:flex;flex-direction:column;gap:3px}
.files span{color:var(--t3);font-feature-settings:"tnum";margin-right:6px}
.spark{display:flex;gap:3px;align-items:flex-end;height:36px}
.spark i{flex:1;background:var(--sf2);border-radius:3px 3px 0 0;position:relative}
.spark i.on{background:var(--ac)}
.spark-l{display:flex;gap:3px;font-size:10px;color:var(--t3)}.spark-l span{flex:1;text-align:center}
.tlwrap{background:var(--sf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tlhead{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tlscroll{overflow-x:auto}
svg text{font-family:var(--f)}
.mark{cursor:pointer}
.info{padding:10px 14px;font-size:13.5px;color:var(--t2);border-top:1px solid var(--line);min-height:44px}
.legend{font-size:12px;color:var(--t3);padding:8px 14px 12px;display:flex;gap:14px;flex-wrap:wrap}

.ok{color:var(--ok);font-weight:700}.ng{color:var(--err);font-weight:700}

table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sf2);font-size:12px;color:var(--t2)}

  lanes.forEach((L,i)=>{
    const y = TOP + i*ROW, cy = y + ROW/2;
    g += `<line x1="0" y1="${y+ROW}" x2="${W}" y2="${y+ROW}" stroke="#ECE6DC"/>`;
    if(L.k==='c'){
      const c=L.c, s=ST[c.state];
      lb += `<line x1="0" y1="${y+ROW}" x2="${LBW}" y2="${y+ROW}" stroke="#ECE6DC"/><g class="mark" data-open="${c.id}"><rect x="0" y="${y}" width="${LBW}" height="${ROW}" fill="transparent"/><circle cx="12" cy="${cy}" r="4.5" class="s-${s}" fill="${{run:'#2F8F6A',slow:'#C08A1E',stop:'#C2492F',none:'#B9B3A8'}[s]}"/><text x="22" y="${cy+4}" font-size="12.5" font-weight="600" fill="#1F2328">${esc(short(c.title))}</text></g>`;
      c.history.forEach(h=>{ if(h.t+3600<start) return; const r=Math.min(3+Math.sqrt(h.n)*1.6,11);
        g += `<circle class="mark" cx="${X(h.t+1800)}" cy="${cy}" r="${r}" fill="#1F2328" fill-opacity=".78" data-info="${esc(c.title)} · ${fmt(h.t)}台 · ファイル更新 ${h.n}件 (${esc(h.sample.join('、'))})"/>`; });
      const na = parseJ(c.next_at);
      if(na && na<=end) g += `<line x1="${X(NOW)}" y1="${cy}" x2="${X(na)}" y2="${cy}" stroke="#C9871F" stroke-dasharray="4 4"/><circle class="mark" cx="${X(na)}" cy="${cy}" r="6" fill="#fff" stroke="#C9871F" stroke-width="2" data-info="${esc(c.title)} · 次の予定 ${esc(c.next_at)}: ${esc(c.next)} (予約の有無は担当の記録次第)"/>`;
      else if(na) g += `<text class="mark" x="${W-4}" y="${cy+4}" font-size="11" fill="#C9871F" text-anchor="end" data-info="${esc(c.title)} · 次の予定 ${esc(c.next_at)}: ${esc(c.next)}">次 ${esc(c.next_at.slice(5,10).replace("-","/"))} →</text>`;
      else g += `<text x="${W-4}" y="${cy+4}" font-size="11" fill="#80858D" text-anchor="end">次 未定</text>`;
    } else {
      const s=L.s;
      lb += `<line x1="0" y1="${y+ROW}" x2="${LBW}" y2="${y+ROW}" stroke="#ECE6DC"/><text x="10" y="${cy+4}" font-size="12.5" font-weight="600" fill="#4A4F57">${esc(s.name.slice(0,innerWidth<600?7:12))}</text>`;
      s.events.forEach(ev=>{
        const dd = D.timeline_date;
        if(ev.every){ for(let m=+ev.from.split(':')[0]*60+ +ev.from.split(':')[1]; m<=+ev.to.split(':')[0]*60+ +ev.to.split(':')[1]; m+=+ev.every){
          const t=parseJ(`${dd} ${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`); if(t>NOW&&t<=end) g+=`<circle class="mark" cx="${X(t)}" cy="${cy}" r="4" fill="#fff" stroke="#C9871F" stroke-width="1.6" data-info="${esc(s.name)} · 予約 ${fmt(t,{hour:'2-digit',minute:'2-digit'})} (予約が実在)"/>`; } return; }
        const t1 = ev.t==='NOW'?NOW:parseJ(`${dd} ${ev.t}`);
        if(ev.t2){ const t2 = ev.t2==='NOW'?NOW:parseJ(`${dd} ${ev.t2}`);
          const brk = ev.kind==='broken';
          g += `<line class="mark" x1="${X(brk?start:t1)}" y1="${cy}" x2="${X(t2)}" y2="${cy}" stroke="${brk?'#C2492F':'#13877F'}" stroke-width="${brk?4:7}" ${brk?'stroke-dasharray="2 5"':''} data-info="${esc(s.name)} · ${esc(ev.label)}"/>`; return; }
        const plan = ev.kind==='plan';
        g += `<circle class="mark" cx="${X(t1)}" cy="${cy}" r="${plan?6:5}" fill="${plan?'#fff':'#1F2328'}" stroke="${plan?'#C9871F':'none'}" stroke-width="2" data-info="${esc(s.name)} · ${esc(ev.t)} ${esc(ev.label)} (${esc(ev.basis)})"/>`;
      });
    }
  });
  g += '</svg>'; lb += '</svg>';
  return filters() + `<div class="tlwrap"><div class="tlhead">${Object.entries(R).map(([k,[l]])=>`<button class="chip" data-range="${k}" aria-pressed="${S.range==k}">${l}</button>`).join('')}
    <span style="font-size:12px;color:var(--t3);margin-left:auto">点をタップで中身・案件名で詳細</span></div>
   <div style="display:flex"><div style="flex:none;border-right:1px solid var(--line)">${lb}</div><div class="tlscroll" style="flex:1">${g}</div></div><div class="info" id="info">${esc(S.info||'点をタップすると、ここに中身が出ます')}</div>
   <div class="legend"><span>● ファイル更新 (大きいほど多い)</span><span style="color:#C9871F">○ 次の予定</span><span style="color:#13877F">━ 開始と終わりを確認した区間</span><span style="color:#C2492F">┅ 障害</span><span>記録の無い区間は塗らない</span></div></div>
   ${S.sel?`<div style="margin-top:14px">${detail(D.cases.find(c=>c.id===S.sel))}</div>`:''}`;
}
function viewSys(){
  const d=D.delivery;
  const sch = D.systems.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><p>${esc(s.status)}</p><p style="color:#8A5A00">${esc(s.next)}</p></div>`).join('');
  return `<div class="card"><h3>報告の届き方</h3><ul>
   <li>AI → チャッピーへの直接送信: <span class="ok">動いている</span> (今日も送信成功を確認。会話が実行中の時は送らず待つ)</li>
   <li>当番 → 作業スレへの指示配送: <span class="ng">止まっている</span> 失敗 ${d.relay_fail_count}件、最後 ${d.relay_fail_last?fmt(d.relay_fail_last):'—'}。原因は送信前の確認処理のタイムアウト。未修理</li>
   <li>Mac から本番のコクピットを開く: 18:28 に許可済み (クロード #7)</li></ul></div>${sch}`;
}
function viewDesign(){
  return `<div class="card"><h3>何を直すか</h3><ul>
   <li>今の本番 (http://100.98.184.95:8790/) は「スレのカード一覧」で、副業は文字のカードだけ。時間軸は11:48の写しの画像で、触れない</li>
   <li>このアプリは、案件を中心に「状態で絞る → 選ぶ → 詳細・成果物・7日の動き → 判断・操作」までを1画面で回す</li></ul></div>
  <div class="card"><h3>画面</h3><table class="t"><tr><th>画面</th><th>中身</th><th>元のデータ</th></tr>
   <tr><td>あなたの番</td><td>本人が決める問いだけ。期限順、選択肢つき</td><td>cases.json の ask・options・due</td></tr>
   <tr><td>案件</td><td>状態 (止まり/鈍い/動いている) で並ぶ一覧＋詳細</td><td>cases.json ＋ 成果物ファイルの更新時刻 (実測)</td></tr>
   <tr><td>時間軸</td><td>今日・3日・7日。ファイル更新の点、次の予定、予約、障害。点をタップで中身</td><td>同上 ＋ timeline.json ＋ 予約の実行記録</td></tr>
   <tr><td>仕組み</td><td>報告の届き方と、見回り・当番の予約</td><td>ops-done.jsonl・Routine の記録</td></tr></table></div>
  <div class="card"><h3>ボタンが実際に動かす物</h3><table class="t"><tr><th>ボタン</th><th>この試作</th><th>本番にした時</th><th>要る承認</th></tr>
   <tr><td>チャッピーに貼る答えをコピー</td><td><b>本物</b>: 端末のコピーだけ</td><td>答えを to-claude.jsonl に書き、見回りが実行</td><td>本人の答えそのものが承認 (台帳に残す)</td></tr>
   <tr><td>担当スレに続きを頼む</td><td>試作のみ (何も送らない)</td><td>見回りが担当スレへ send_message</td><td>不要 (AI どうし)</td></tr>
   <tr><td>この案件を止める</td><td>試作のみ</td><td>cases.json の状態を書き換え</td><td>本人が押す時は不要</td></tr>
   <tr><td>絞込み・時間軸の拡大・詳細</td><td>本物 (画面の中だけ)</td><td>同じ</td><td>—</td></tr></table></div>
  <div class="card"><h3>データの流れ</h3><p>制作スレ・見回り → cases.json と成果物ファイル → (毎時) 集計 → アプリ。ボタン → 本番では受け口 (POST) → to-claude.jsonl → 見回り → 担当スレ。画面が直接スレを動かすことはしない。</p></div>
  <div class="card"><h3>本番にする道 (どちらも本人の承認が要る)</h3><ul>
   <li>A. 本番のコクピットに「副業」画面を足す: コクピットの中身は書き換え禁止の鍵がかかっているので、鍵を外す承認が要る。Tailscale の中だけで、全案件を出せる</li>
   <li>B. 読むだけの小さな画面を別の入口 (例 8791 番) で常駐させる: 新しい常駐なので承認が要る。ボタンは当面コピーだけ</li>
   <li>この試作は公開ページの写し (副業と仕組みだけ、取引先・INNFRA・個人の資料は入れていない)。7日で自動削除</li></ul></div>`;
}
function render(){
  tabs();
  $('#fresh').textContent = `データ ${fmt(NOW)} 時点の写し`;
  const V = {mine:viewMine, list:viewList, tl:viewTL, sys:viewSys, design:viewDesign};
  $('#main').innerHTML = V[S.tab]();
  const sc=$('.tlscroll'); if(sc){ const svg=sc.querySelector('svg'); const nx=+svg.dataset.now; if(nx>sc.clientWidth) sc.scrollLeft = nx - sc.clientWidth*0.7; }
  const q=$('#q'); if(q){ q.oninput = e=>{ S.q=e.target.value; const p=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p); }; }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-open],[data-info],[data-close]'); if(!b) return;
  if(b.dataset.tab){ S.tab=b.dataset.tab; history.replaceState(null,'','#'+S.tab); S.sel=null; S.info=''; return render(); }
  if(b.dataset.state){ S.state=b.dataset.state; return render(); }
  if('ask' in b.dataset){ S.onlyAsk=!S.onlyAsk; return render(); }
  if(b.dataset.range){ S.range=+b.dataset.range; return render(); }
  if('close' in b.dataset){ S.sel=null; return render(); }
  if(b.dataset.id){ S.sel=b.dataset.id; return render(); }
  if(b.dataset.open){ S.sel=b.dataset.open; if(S.tab==='mine') S.tab='list'; return render(); }
  if(b.dataset.info){ S.info=b.dataset.info; const i=$('#info'); if(i) i.textContent=S.info; return; }
  if(b.dataset.pick!==undefined){ const id=b.dataset.for||S.sel; S.pick[id]=+b.dataset.pick; return render(); }
  if('copy' in b.dataset){ const c=D.cases.find(x=>x.id===(b.dataset.for||S.sel)); const i=S.pick[c.id];
    const txt=`【副業: ${c.title}】${c.ask}\n→ ${'①②③④'[i]} ${c.options[i]}\n(副業コクピットから。本人の答え)`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('コピーしました。チャッピーの会話に貼ると、それが答えになります'),()=>{prompt('この文をコピーしてチャッピーへ',txt);}); return; }
  if(b.dataset.proto){ toast('試作なので何も送っていません。本番では: '+b.dataset.proto); return; }
});
let lastW=innerWidth; addEventListener('resize', ()=>{ if(Math.abs(innerWidth-lastW)<40) return; lastW=innerWidth; clearTimeout(render.h); render.h=setTimeout(render,150); });
render();
</script>
</body>
</html>
