<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="収益ファネル: 無料診断からキット2980円を経てBackendへ">
  <g font-family="sans-serif">
    <rect x="20" y="60" width="270" height="120" rx="6" fill="#201a13" stroke="#a99a7d" stroke-width="2"/>
    <text x="155" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#f0e8d6">入口 (無料)</text>
    <text x="155" y="120" text-anchor="middle" font-size="15" fill="#cdbd9e">原価マップ1枚 + 7問診断</text>
    <text x="155" y="146" text-anchor="middle" font-size="15" fill="#cdbd9e">→ メール1件で捕捉</text>
    <text x="155" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#d99a3f">¥0</text>

    <rect x="365" y="60" width="270" height="120" rx="6" fill="#201a13" stroke="#d99a3f" stroke-width="3"/>
    <text x="500" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#f0e8d6">第1プロダクト</text>
    <text x="500" y="120" text-anchor="middle" font-size="15" fill="#cdbd9e">損益解剖キット + シミュレーター</text>
    <text x="500" y="146" text-anchor="middle" font-size="15" fill="#cdbd9e">(既存資産でほぼ完成)</text>
    <text x="500" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#d99a3f">¥1,980–2,980</text>

    <rect x="710" y="60" width="270" height="120" rx="6" fill="#201a13" stroke="#86a86e" stroke-width="2"/>
    <text x="845" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#f0e8d6">Backend</text>
    <text x="845" y="120" text-anchor="middle" font-size="15" fill="#cdbd9e">次巻キット / 月額マガジン</text>
    <text x="845" y="146" text-anchor="middle" font-size="15" fill="#cdbd9e">→ L3 (B2B) へ接続</text>
    <text x="845" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#86a86e">A検証 positive 後に開く</text>

    <path d="M292 120 L362 120" stroke="#a99a7d" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M637 120 L707 120" stroke="#a99a7d" stroke-width="2" marker-end="url(#ar)"/>
    <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a99a7d"/></marker></defs>
  </g>
</svg>
