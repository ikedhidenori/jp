<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="リスクと対策と撤退条件のマトリクス">
  <g font-family="sans-serif" font-size="15">
    <rect x="20" y="20" width="960" height="46" fill="#2a2118"/>
    <text x="34" y="49" fill="#cdbd9e" font-weight="700">リスク</text>
    <text x="380" y="49" fill="#cdbd9e" font-weight="700">対策 (mitigation)</text>
    <text x="720" y="49" fill="#cdbd9e" font-weight="700">撤退条件 (機械判定)</text>

    <rect x="20" y="66" width="960" height="58" fill="#201a13"/>
    <rect x="20" y="66" width="6" height="58" fill="#c0472e"/>
    <text x="40" y="98" fill="#f0e8d6">診断が行動を変えない (P0)</text>
    <text x="380" y="98" fill="#cdbd9e">実測前に新戦略・ツールを作らない</text>
    <text x="720" y="98" fill="#e0785f">第一波実測前の新SSoT ≥1本で警告</text>

    <rect x="20" y="126" width="960" height="58" fill="#1c1610"/>
    <rect x="20" y="126" width="6" height="58" fill="#c0472e"/>
    <text x="40" y="158" fill="#f0e8d6">単一障害点=アカウント作成 (P2)</text>
    <text x="380" y="158" fill="#cdbd9e">直列1本ランブックに集約・60分</text>
    <text x="720" y="158" fill="#e0785f">開店が今週内に完了しない</text>

    <rect x="20" y="186" width="960" height="52" fill="#201a13"/>
    <rect x="20" y="186" width="6" height="52" fill="#d99a3f"/>
    <text x="40" y="216" fill="#f0e8d6">規約 (KDP=AI開示 / note)</text>
    <text x="380" y="216" fill="#cdbd9e">AI生成を正直開示・一次情報の皮</text>
    <text x="720" y="216" fill="#d99a3f">アカウント停止・規約違反=即撤退</text>
  </g>
</svg>
