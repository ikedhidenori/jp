<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-label="30日90日180日の判定ゲート timeline">
  <line x1="40" y1="70" x2="960" y2="70" stroke="#34291d" stroke-width="3"/>
  <g font-family="sans-serif">
    <circle cx="70" cy="70" r="9" fill="#d99a3f"/><text x="70" y="46" text-anchor="middle" font-size="15" fill="#a99a7d">今週</text>
    <text x="70" y="104" text-anchor="middle" font-size="15" fill="#cdbd9e">開店</text>

    <circle cx="360" cy="70" r="11" fill="#d99a3f"/><text x="360" y="44" text-anchor="middle" font-size="16" fill="#f0e8d6" font-weight="700">G-1 · 30日</text>
    <text x="360" y="120" text-anchor="middle" font-size="15" fill="#cdbd9e">有料 <tspan fill="#86a86e" font-weight="700">1件以上</tspan> → L2 着手</text>
    <text x="360" y="142" text-anchor="middle" font-size="14" fill="#a99a7d">全0 → 価格/表紙のA/Bのみ</text>

    <circle cx="640" cy="70" r="11" fill="#d99a3f"/><text x="640" y="44" text-anchor="middle" font-size="16" fill="#f0e8d6" font-weight="700">G-2 · 90日</text>
    <text x="640" y="120" text-anchor="middle" font-size="15" fill="#cdbd9e">累計有料 <tspan fill="#86a86e" font-weight="700">10件</tspan> or 月商 <tspan fill="#86a86e" font-weight="700">1万円</tspan></text>
    <text x="640" y="142" text-anchor="middle" font-size="14" fill="#a99a7d">未達 → L3(B2B) 全振りへ縮退</text>

    <circle cx="920" cy="70" r="11" fill="#a99a7d"/><text x="920" y="44" text-anchor="middle" font-size="16" fill="#cdbd9e" font-weight="700">G-3 · 180日</text>
    <text x="920" y="120" text-anchor="middle" font-size="14" fill="#a99a7d">月商10万未達→</text>
    <text x="920" y="140" text-anchor="middle" font-size="14" fill="#a99a7d">新規製作停止</text>
  </g>
  <text x="40" y="210" font-family="sans-serif" font-size="14" fill="#a99a7d">数値は 3tier-plan §4 の判定閾値 (実測基準)。これ以外の月商予測は <tspan fill="#d99a3f">[estimate]</tspan> であり本デッキには載せない</text>
</svg>
