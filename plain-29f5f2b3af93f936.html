<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>落とした19問 — 原因をタップ</title>
<style>
:root{--bg:#f4f2ec;--fg:#1f1e1c;--mut:#6d6a63;--line:#d6d1c6;--on:#1f1e1c;--onfg:#f4f2ec}
@media (prefers-color-scheme:dark){:root{--bg:#22201d;--fg:rgba(240,234,222,.88);--mut:rgba(240,234,222,.55);--line:#3a3733;--on:rgba(240,234,222,.85);--onfg:#22201d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 80px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}.lead{font-size:14px;color:var(--mut);margin:0 0 20px}
.row{border-top:1px solid var(--line);padding:14px 0}
.hd{display:flex;gap:10px;align-items:baseline}.q{font-weight:600;min-width:2.6em;font-variant-numeric:tabular-nums}
.band{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--mut)}
.f{font-size:12px;color:var(--mut)}.t{font-size:15px;margin:2px 0 0}.m{font-size:12px;color:var(--mut);margin:2px 0 0}
.ch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.ch button{font:inherit;font-size:14px;padding:14px 0;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg)}
.ch button.on{background:var(--on);color:var(--onfg);border-color:var(--on)}
h2{font-size:16px;font-weight:600;margin:36px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}th{font-weight:600;color:var(--mut)}td:first-child,th:first-child{text-align:left}
.done{font-size:14px;margin:12px 0}
.copy{display:block;width:100%;font:inherit;font-weight:600;padding:14px;margin-top:16px;border:0;border-radius:10px;background:var(--on);color:var(--onfg)}
.foot{font-size:12px;color:var(--mut);margin-top:28px}
</style></head><body><main>
<h1>落とした19問 — 原因をタップ</h1>
<p class="lead">令和8年度の本試験で落とした問題です。各行で、いちばん近い原因を1つ選んでください。もう一度押すと取り消せます。結果はこの端末に残ります。10分ほど。<br>知識不足＝知らなかった／読み違い＝知っていたのに取り違えた／時間・塗り＝時間が足りず塗った／不明＝思い出せない</p>
<div id="list"></div>
<h2>集計</h2>
<p class="done" id="done"></p>
<table id="sum"></table>
<button class="copy" id="copy">結果をコピーしてクロードに渡す</button>
<p class="foot">帯の分け方: 高=多くの受験生が取れた基本 / 中=5割前後 / 低=難問・範囲外。R8の問別の正答率がまだ公開されていないため、各校の講評をもとにしたAIの見立て。正答率が出たら差し替える (高60%以上・中40〜60%・低40%未満)<br>問題文は載せていません。</p>
</main>
<script>
const D={"title": "令和8年度 宅建 本試験 (2026-10-18) 落とした19問", "version": "v1 2026-10-19", "band_basis": "高=多くの受験生が取れた基本 / 中=5割前後 / 低=難問・範囲外。R8の問別の正答率がまだ公開されていないため、各校の講評をもとにしたAIの見立て。正答率が出たら差し替える (高60%以上・中40〜60%・低40%未満)", "cause_choices": ["知識不足", "読み違い", "時間・塗り", "不明"], "source": "~/private/takken-2026/honshiken/2026-10-18-answers.md・講評ページ。問題文は載せない", "rows": [{"q": 3, "field": "権利関係", "topic": "共有: 持分を超える使用の対価", "band": "高", "memo": "問1〜4は読まずに塗った", "cause": "時間・塗り"}, {"q": 5, "field": "権利関係", "topic": "使用貸借が終わるとき", "band": "高", "memo": "問題用紙では正解の4に丸、別の番号を選んだ", "cause": null}, {"q": 6, "field": "権利関係", "topic": "他人物の売買・賃貸借", "band": "低", "memo": "", "cause": null}, {"q": 7, "field": "権利関係", "topic": "復代理人の引渡義務", "band": "低", "memo": "", "cause": null}, {"q": 8, "field": "権利関係", "topic": "解除の不可分・合意解除と第三者", "band": "中", "memo": "", "cause": null}, {"q": 9, "field": "権利関係", "topic": "法定地上権が成立するか", "band": "中", "memo": "", "cause": null}, {"q": 12, "field": "権利関係", "topic": "居住用建物の賃借権の承継と特約", "band": "低", "memo": "塗りは写真から推定", "cause": null}, {"q": 14, "field": "権利関係", "topic": "登記: 国内連絡先 (2026年4月の改正)", "band": "低", "memo": "", "cause": null}, {"q": 15, "field": "法令上の制限", "topic": "特別用途地区の定義", "band": "低", "memo": "", "cause": null}, {"q": 17, "field": "法令上の制限", "topic": "建築基準法: 非常用照明・勧告", "band": "中", "memo": "", "cause": null}, {"q": 19, "field": "法令上の制限", "topic": "盛土規制法: 説明会と届出", "band": "中", "memo": "", "cause": null}, {"q": 20, "field": "法令上の制限", "topic": "区画整理: 組合員になるのは誰か", "band": "高", "memo": "問題用紙では正解の2に「?×」、別の番号を選んだ", "cause": null}, {"q": 23, "field": "税・価格", "topic": "住宅取得資金の贈与の特例", "band": "高", "memo": "塗りは写真から推定", "cause": null}, {"q": 27, "field": "宅建業法", "topic": "監督処分と罰則", "band": "低", "memo": "", "cause": null}, {"q": 29, "field": "宅建業法", "topic": "媒介契約書面の電磁的提供と承諾", "band": "中", "memo": "", "cause": null}, {"q": 37, "field": "宅建業法", "topic": "報酬: 居住用の貸借・空家の特例", "band": "高", "memo": "", "cause": null}, {"q": 39, "field": "宅建業法", "topic": "35条: 金銭の貸借のあっせん", "band": "高", "memo": "", "cause": null}, {"q": 42, "field": "宅建業法", "topic": "クーリング・オフの告知書面", "band": "低", "memo": "", "cause": null}, {"q": 47, "field": "5問免除", "topic": "広告表示: セットバックの明示", "band": "中", "memo": "", "cause": null}]};
const KEY="takken-19mon-v1";
const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
D.rows.forEach(r=>{if(saved[r.q]===undefined&&r.cause)saved[r.q]=r.cause});
const list=document.getElementById("list");
D.rows.forEach(r=>{
 const el=document.createElement("div");el.className="row";
 el.innerHTML=`<div class="hd"><span class="q">問${r.q}</span><span class="band">帯 ${r.band}</span><span class="f">${r.field}</span></div><p class="t">${r.topic}</p>${r.memo?`<p class="m">${r.memo}</p>`:""}<div class="ch"></div>`;
 const ch=el.querySelector(".ch");
 D.cause_choices.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c;if(saved[r.q]===c)b.className="on";
  b.onclick=()=>{saved[r.q]=(saved[r.q]===c)?undefined:c;localStorage.setItem(KEY,JSON.stringify(saved));ch.querySelectorAll("button").forEach(x=>x.className=(saved[r.q]===x.textContent)?"on":"");render()};ch.appendChild(b)});
 list.appendChild(el)});
function render(){
 const bands=["高","中","低"],cols=[...D.cause_choices,"未回答"];
 let h="<tr><th>帯</th>"+cols.map(c=>`<th>${c}</th>`).join("")+"<th>計</th></tr>";
 bands.forEach(b=>{const rs=D.rows.filter(r=>r.band===b);h+=`<tr><td>${b}</td>`+cols.map(c=>`<td>${rs.filter(r=>(saved[r.q]||"未回答")===c).length||""}</td>`).join("")+`<td>${rs.length}</td></tr>`});
 document.getElementById("sum").innerHTML=h;
 const n=D.rows.filter(r=>saved[r.q]).length;document.getElementById("done").textContent=`${n} / 19 問 回答済み`}
render();
document.getElementById("copy").onclick=()=>{
 const t="宅建19問 原因\n"+D.rows.map(r=>`問${r.q} ${saved[r.q]||"未回答"}`).join("\n");
 navigator.clipboard.writeText(t).then(()=>{document.getElementById("copy").textContent="コピーしました"},()=>{prompt("コピーしてください",t)})};
</script></body></html>
